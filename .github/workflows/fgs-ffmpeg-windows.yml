name: FGS FFmpeg Static Windows x64

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/fgs-ffmpeg-windows.yml"
      - ".github/fgs/**"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read
  packages: read

concurrency:
  group: fgs-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.channel.name }} Windows x64 static
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        channel:
          - name: Master
            ref: master
          - name: Stable
            ref: release/9.1
    steps:
      - name: Checkout FGS build recipe
        uses: actions/checkout@v4
      - name: Checkout proven static FFmpeg-Builds dependency recipe
        uses: actions/checkout@v4
        with:
          repository: FFmpeg-Builds/FFmpeg-Builds
          ref: 7f2a6b1050d302144de8366afa37a75e46f326aa
          path: builder
          persist-credentials: false
      - name: Prepare pinned stock-SVT static builder and patch
        run: |
          python3 .github/fgs/prepare-builder.py
          git apply --stat .github/fgs/host-image-copy.patch
          bash -n builder/build.sh
          grep -q 'GIT_BRANCH_OVERRIDE' builder/build.sh
          grep -q 'FFMPEG_REPO_OVERRIDE' builder/build.sh
      - name: Free disk with upstream build helper
        run: bash builder/util/free_disk_space.sh
      - name: Log in for upstream static toolchain image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Windows x64 static FFmpeg
        env:
          FFMPEG_REPO_OVERRIDE: https://github.com/FFmpeg/FFmpeg.git
          GIT_BRANCH_OVERRIDE: ${{ matrix.channel.ref }}
        run: |
          cd builder
          bash build.sh win64 gpl
      - name: Install PE inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-x86-64 unzip file
      - name: Inspect static Windows binaries and FGS capabilities
        env:
          CHANNEL: ${{ matrix.channel.name }}
          SOURCE_REF: ${{ matrix.channel.ref }}
          ARTIFACT_DIR: builder/artifacts
        run: |
          bash .github/fgs/check-static.sh
      - name: Upload static Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: FGS-FFmpeg-${{ matrix.channel.name }}-Windows-x64-Static
          path: |
            FGS-FFmpeg-${{ matrix.channel.name }}-Windows-x64-Static.zip
            FGS-FFmpeg-${{ matrix.channel.name }}-Windows-x64-Static.zip.sha256
            FGS-FFmpeg-${{ matrix.channel.name }}-BUILD.txt
          if-no-files-found: error
          retention-days: 14
