name: FGS FFmpeg Static Windows x64

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/fgs-ffmpeg-windows.yml"
      - ".github/fgs/**"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: fgs-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.channel.name }} Windows x64 static
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        channel:
          - name: Master
            ref: master
          - name: Stable
            ref: release/9.1
    steps:
      - name: Checkout FGS build recipe
        uses: actions/checkout@v4
      - name: Checkout proven static FFmpeg-Builds dependency recipe
        uses: actions/checkout@v4
        with:
          repository: FFmpeg-Builds/FFmpeg-Builds
          ref: 7f2a6b1050d302144de8366afa37a75e46f326aa
          path: builder
          persist-credentials: false
      - name: Prepare pinned stock-SVT static builder and patch
        run: |
          python3 .github/fgs/prepare-builder.py
          git apply --stat .github/fgs/host-image-copy.patch
          bash -n builder/build.sh
          grep -q 'GIT_BRANCH_OVERRIDE' builder/build.sh
          grep -q 'FFMPEG_REPO_OVERRIDE' builder/build.sh
      - name: Free disk with upstream build helper
        run: bash builder/util/free_disk_space.sh
      - name: Log in for upstream static toolchain image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Windows x64 static FFmpeg
        env:
          FFMPEG_REPO_OVERRIDE: https://github.com/FFmpeg/FFmpeg.git
          GIT_BRANCH_OVERRIDE: ${{ matrix.channel.ref }}
        run: |
          cd builder
          bash build.sh win64 gpl
      - name: Install PE inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-x86-64 unzip file
      - name: Inspect static Windows binaries and FGS capabilities
        env:
          CHANNEL: ${{ matrix.channel.name }}
          SOURCE_REF: ${{ matrix.channel.ref }}
          ARTIFACT_DIR: builder/artifacts
        run: |
          bash .github/fgs/check-static.sh
      - name: Upload static Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: FGS-FFmpeg-${{ matrix.channel.name }}-Windows-x64-Static
          path: |
            FGS-FFmpeg-${{ matrix.channel.name }}-Windows-x64-Static.zip
            FGS-FFmpeg-${{ matrix.channel.name }}-Windows-x64-Static.zip.sha256
            FGS-FFmpeg-${{ matrix.channel.name }}-BUILD.txt
          if-no-files-found: error
          retention-days: 14

  publish-nightly:
    name: Publish verified nightly Windows x64
    if: github.event_name == 'schedule'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Stable
        uses: actions/download-artifact@v4
        with:
          name: FGS-FFmpeg-Stable-Windows-x64-Static
          path: dist/Stable
      - name: Download Master
        uses: actions/download-artifact@v4
        with:
          name: FGS-FFmpeg-Master-Windows-x64-Static
          path: dist/Master
      - name: Validate downloaded binaries and publish nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for channel in Stable Master; do
            (cd "dist/$channel" && sha256sum --check "FGS-FFmpeg-$channel-Windows-x64-Static.zip.sha256")
            unzip -tq "dist/$channel/FGS-FFmpeg-$channel-Windows-x64-Static.zip" > /dev/null
          done
          tag="nightly-$(date -u +%Y%m%d)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Nightly $tag already exists. Nothing will be overwritten."
            exit 0
          fi
          cat > nightly-notes.md <<'NOTES'
          Automated FGS FFmpeg Windows x64 static nightly.

          - **Stable:** official FFmpeg `release/9.1` with FGS Vulkan/CUDA interop patch.
          - **Master:** official FFmpeg `master` with the same patch.
          - **SVT-AV1:** official upstream library, not SVT-AV1-HDR.
          - Builds fetch upstream branch HEAD each run; the `rampageX/FFmpeg` Git branch is not force-synced.
          - Both variants passed the Windows PE static-import check, Wine capability checks and CI build.
          - GPU-specific work still requires local acceptance before replacing FGS production dependencies.
          NOTES
          gh release create "$tag" \
            "dist/Stable/FGS-FFmpeg-Stable-Windows-x64-Static.zip" \
            "dist/Master/FGS-FFmpeg-Master-Windows-x64-Static.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "FGS FFmpeg Nightly $(date -u +%Y-%m-%d)" \
            --notes-file nightly-notes.md --prerelease --latest=false
