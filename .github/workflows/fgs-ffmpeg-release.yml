name: Publish validated FGS FFmpeg Windows Release

on:
  push:
    branches: [master]
    paths:
      - ".github/fgs/release-version.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the two previously verified builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=45021608480
          if [ "$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" != "success" ]; then
            echo "Refusing to publish an unverified FFmpeg build" >&2
            exit 1
          fi
          mkdir -p dist/Stable dist/Master
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name FGS-FFmpeg-Stable-Windows-x64-Static --dir dist/Stable
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name FGS-FFmpeg-Master-Windows-x64-Static --dir dist/Master
          for channel in Stable Master; do
            (cd "dist/$channel" && sha256sum --check "FGS-FFmpeg-$channel-Windows-x64-Static.zip.sha256")
            unzip -tq "dist/$channel/FGS-FFmpeg-$channel-Windows-x64-Static.zip" > /dev/null
          done
      - name: Publish Windows Stable and Master builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(tr -d "\r\n" < .github/fgs/release-version.txt)"
          [[ "$tag" =~ ^fgs-[0-9]{4}[.][0-9]{2}[.][0-9]{2}(-hdr)?$ ]] || { echo "Unexpected release tag: $tag" >&2; exit 1; }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "This release exists. Refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$tag" \
            "dist/Stable/FGS-FFmpeg-Stable-Windows-x64-Static.zip" \
            "dist/Master/FGS-FFmpeg-Master-Windows-x64-Static.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "FGS FFmpeg · Stable 9.1 + Master SVT-AV1-HDR · Windows x64" \
            --notes-file .github/fgs/RELEASE_NOTES.md --latest
